# Ports: admin UI 8093, rpcnode-server 8094, snapshot CDN 8095.
services:
  server:
    build:
      context: .
      dockerfile: app/Dockerfile
      target: server
    image: rpcnode-server:local
    restart: unless-stopped
    environment:
      # Blank = echo any Origin (admin :8093 → this API :8094). Unset = localhost only.
      PANEL_CORS_ORIGINS: ""
      PANEL_PORT: "8094"
    ports:
      - "${RPCNODE_SERVER_PORT:-8094}:8094"
    volumes:
      # Host dir: toolkit.db, panel.htpasswd, sessions, logs, install/
      - ${RPCNODE_DATA:-./data}:/data

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: rpcnode-admin:local
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${RPCNODE_PORT:-8093}:8080"

  cdn:
    build:
      context: .
      dockerfile: app/Dockerfile
      target: cdn
    image: rpcnode-cdn:local
    profiles:
      - cdn
    restart: unless-stopped
    volumes:
      - rpcnode-cdn-data:/data

  cdn-site:
    build: ./cdn-site
    image: rpcnode-cdn-site:local
    profiles:
      - cdn
    restart: unless-stopped
    environment:
      SNAPSHOT_CDN_DIR: /data
    volumes:
      - rpcnode-cdn-data:/data

  cdn-nginx:
    image: nginx:1.27-alpine
    profiles:
      - cdn
    restart: unless-stopped
    depends_on:
      - cdn-site
    ports:
      - "${CDN_HTTP_PORT:-8095}:8095"
    volumes:
      - ./cdn-site/deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - rpcnode-cdn-data:/data:ro

volumes:
  rpcnode-cdn-data:
