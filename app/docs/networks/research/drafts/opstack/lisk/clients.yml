# Lisk: Lisk L2 (Superchain Registry `lisk`): op-reth v2.6.0 + op-node v1.19.9 — exactly the pins in LiskHQ/lisk-node. Sepolia omitted: public RPC is dead and the repo needs a patched op-node for Lisk Sepolia.
# op-reth + op-node: pinned tags of ethereum-optimism/optimism, compiled by the panel build hosts (`build:`) and synced as `<name>-<arch>`;
# a host without the prebuilt binary compiles them itself (run.sh.tmpl). The pins MUST equal OpstackToolchain.RETH_TAG / NODE_TAG (a test keeps them equal).
# Dockerfiles: copy shared/op-reth.Dockerfile + shared/op-node.Dockerfile beside this file (the loader rejects paths), or adopt the shared-dockerfile core change (FAMILY.md section 10).
programs:
  - env: mainnet
    id: op-reth
    source: { type: pinned, version: "2.6.0", tag: "op-reth/v2.6.0", label: "ethereum-optimism/optimism" }
    build: { dockerfile: op-reth.Dockerfile, outputs: [op-reth], platforms: [linux/amd64, linux/arm64] }
    requirements: { logFile: logs/lisk.log }
    artifacts: []
    ports:
      - { role: http, port: 41870, label: "EL JSON-RPC", config: required }
      - { role: ws, port: 41871, label: "EL WebSocket", config: required }
      - { role: engine, port: 41873, label: "EL Engine API (127.0.0.1)", config: required }
      - { role: metrics, port: 41874, label: "EL metrics", config: required }
      - { role: p2p, port: 41872, label: "EL P2P", config: required, protocol: both }
      - { role: discv5, port: 41878, label: "EL discv5 (UDP)", config: required, protocol: udp }
  - env: mainnet
    id: op-node
    source: { type: pinned, version: "1.19.9", tag: "op-node/v1.19.9", label: "ethereum-optimism/optimism" }
    build: { dockerfile: op-node.Dockerfile, outputs: [op-node], platforms: [linux/amd64, linux/arm64] }
    requirements: { logFile: logs/lisk.log }
    artifacts: []
    ports:
      - { role: cl_rpc, port: 41875, label: "op-node RPC", config: required }
      - { role: cl_metrics, port: 41877, label: "op-node metrics", config: required }
      - { role: cl_p2p, port: 41876, label: "op-node P2P", config: required, protocol: both }
