# Scroll l2geth from Docker Hub scrolltech/l2geth (binary /usr/local/bin/geth, layer 2 of the image, 16 MB; glibc dynamic;
# amd64 ONLY - no arm64 manifest). GitHub scroll-tech/go-ethereum releases carry no assets and lag (v5.10.2 vs image v5.10.10).
# Version resolver: newest stable Docker Hub tag matching ^scroll-v\d+\.\d+\.\d+$ (rc / -skip-signer-check excluded).
# The packed tarball keeps the versionless name; inside: bin/l2geth.
programs:
  - env: mainnet
    id: l2geth
    source: { type: github, repo: scroll-tech/go-ethereum }
    artifacts:
      - name: "l2geth-x86_64-linux.tar.gz"
        urlTemplate: "docker://scrolltech/l2geth:{tag}"
    requirements: { logFile: logs/node.out }
    ports:
      - { role: http, port: 42320, label: "HTTP JSON-RPC", config: required }
      - { role: ws, port: 42321, label: "WebSocket JSON-RPC", config: required }
      - { role: p2p, port: 42322, label: "P2P", config: required, protocol: both }
      - { role: metrics, port: 42324, label: "Metrics (127.0.0.1)", config: required }
  - env: sepolia
    id: l2geth
    source: { type: github, repo: scroll-tech/go-ethereum }
    artifacts:
      - name: "l2geth-x86_64-linux.tar.gz"
        urlTemplate: "docker://scrolltech/l2geth:{tag}"
    requirements: { logFile: logs/node.out }
    ports:
      - { role: http, port: 42330, label: "HTTP JSON-RPC", config: required }
      - { role: ws, port: 42331, label: "WebSocket JSON-RPC", config: required }
      - { role: p2p, port: 42332, label: "P2P", config: required, protocol: both }
      - { role: metrics, port: 42334, label: "Metrics (127.0.0.1)", config: required }

# Official snapshot (one fixed URL, resumable Range). tar members: data/geth/... -> extract with --strip-components=1 into the datadir.
snapshots:
  mainnet:
    archive:
      mirror: "https://snapshot.scroll.io/mpt/"
      filename: latest.tar
      discover: fixed
