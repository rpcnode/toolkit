# gravity_node / gravity_cli from Galxe/gravity-sdk GitHub releases (no Docker). VERIFIED 2026-10-13 (HTTP 200): v1.9.3 (2026-09-18, stable) assets are the raw static
# linux x86_64 executables `gravity_node` (132 MB) and `gravity_cli` (29 MB) (+ .sha256). No arm64 build. v1.10.0 is a prerelease (mainnet follows stable: v1.9.1+ required since 2026-08-18).
# Testnet tags are `v1.10.1-testnet` style prereleases -> testnet needs includePrerelease + a tag-suffix filter (`tagSuffix: "-testnet"`, NOT supported by HttpGitHubReleaseClient today, see FAMILY.md).
# Chain files: genesis.json + waypoint.txt at galxe/gravity-sdk genesis/{mainnet,testnet}/ (they must match each other; pin to the release tag, never `main`).
# Ports come from specs/PORTS.md (gravity base 41600): mainnet 41600-41609, testnet 41610-41619. Gravity's own defaults (8545, 8661, 9001, 10001, 12024, 6180/6195) are not used.
programs:
  - env: mainnet
    id: gravity_node
    source: { type: github, repo: Galxe/gravity-sdk }
    artifacts:
      - name: "gravity_node-linux-amd64"
        urlTemplate: "https://github.com/Galxe/gravity-sdk/releases/download/{tag}/gravity_node"
      - name: "gravity_cli-linux-amd64"
        urlTemplate: "https://github.com/Galxe/gravity-sdk/releases/download/{tag}/gravity_cli"
    configs:
      - name: "genesis.json"
        urlTemplate: "https://raw.githubusercontent.com/Galxe/gravity-sdk/{tag}/genesis/mainnet/genesis.json"
      - name: "waypoint.txt"
        urlTemplate: "https://raw.githubusercontent.com/Galxe/gravity-sdk/{tag}/genesis/mainnet/waypoint.txt"
    requirements: { logFile: logs/gravity.log }
    ports:
      - { role: http, port: 41600, label: "HTTP RPC", config: required }
      - { role: ws, port: 41601, label: "WebSocket RPC", config: required }
      - { role: p2p, port: 41602, label: "Reth P2P", config: required, protocol: both }
      - { role: engine, port: 41603, label: "Reth authrpc", config: required }
      - { role: metrics, port: 41604, label: "Reth metrics", config: required }
      - { role: inspection, port: 41605, label: "Inspection service", config: required }
      - { role: consensus_p2p, port: 41606, label: "Public network P2P", config: required }
  - env: testnet
    id: gravity_node
    source: { type: github, repo: Galxe/gravity-sdk, tagSuffix: "-testnet", prerelease: true }
    artifacts:
      - name: "gravity_node-linux-amd64"
        urlTemplate: "https://github.com/Galxe/gravity-sdk/releases/download/{tag}/gravity_node"
      - name: "gravity_cli-linux-amd64"
        urlTemplate: "https://github.com/Galxe/gravity-sdk/releases/download/{tag}/gravity_cli"
    configs:
      - name: "genesis.json"
        urlTemplate: "https://raw.githubusercontent.com/Galxe/gravity-sdk/{tag}/genesis/testnet/genesis.json"
      - name: "waypoint.txt"
        urlTemplate: "https://raw.githubusercontent.com/Galxe/gravity-sdk/{tag}/genesis/testnet/waypoint.txt"
    requirements: { logFile: logs/gravity.log }
    ports:
      - { role: http, port: 41610, label: "HTTP RPC", config: required }
      - { role: ws, port: 41611, label: "WebSocket RPC", config: required }
      - { role: p2p, port: 41612, label: "Reth P2P", config: required, protocol: both }
      - { role: engine, port: 41613, label: "Reth authrpc", config: required }
      - { role: metrics, port: 41614, label: "Reth metrics", config: required }
      - { role: inspection, port: 41615, label: "Inspection service", config: required }
      - { role: consensus_p2p, port: 41616, label: "Public network P2P", config: required }
