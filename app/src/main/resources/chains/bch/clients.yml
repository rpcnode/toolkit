programs:
  - env: mainnet
    id: bitcoin-cash
    source: { type: github, repo: bitcoin-cash-node/bitcoin-cash-node }
    artifacts:
      - name: "bitcoin-cash-node-x86_64-linux-gnu.tar.gz"
        nameAarch64: "bitcoin-cash-node-aarch64-linux-gnu.tar.gz"
        urlTemplate: "https://github.com/bitcoin-cash-node/bitcoin-cash-node/releases/download/{tag}/bitcoin-cash-node-{version}-x86_64-linux-gnu.tar.gz"
        urlTemplateAarch64: "https://github.com/bitcoin-cash-node/bitcoin-cash-node/releases/download/{tag}/bitcoin-cash-node-{version}-aarch64-linux-gnu.tar.gz"
    configs:
      - name: bitcoin.conf
        urlTemplate: "https://raw.githubusercontent.com/bitcoin-cash-node/bitcoin-cash-node/{tag}/share/examples/bitcoin.conf"
    ports:
      - { role: p2p, port: 8343, label: "P2P", config: required }
      - { role: rpc, port: 8342, label: "RPC", config: required }
      - { role: rpc_public, port: 8433, label: "RPC proxy (no login)", config: none }
  - env: testnet
    id: bitcoin-cash
    source: { type: github, repo: bitcoin-cash-node/bitcoin-cash-node }
    artifacts:
      - name: "bitcoin-cash-node-x86_64-linux-gnu.tar.gz"
        nameAarch64: "bitcoin-cash-node-aarch64-linux-gnu.tar.gz"
        urlTemplate: "https://github.com/bitcoin-cash-node/bitcoin-cash-node/releases/download/{tag}/bitcoin-cash-node-{version}-x86_64-linux-gnu.tar.gz"
        urlTemplateAarch64: "https://github.com/bitcoin-cash-node/bitcoin-cash-node/releases/download/{tag}/bitcoin-cash-node-{version}-aarch64-linux-gnu.tar.gz"
    configs:
      - name: bitcoin.conf
        urlTemplate: "https://raw.githubusercontent.com/bitcoin-cash-node/bitcoin-cash-node/{tag}/share/examples/bitcoin.conf"
    ports:
      - { role: p2p, port: 18343, label: "P2P", config: required }
      - { role: rpc, port: 18342, label: "RPC", config: required }
      - { role: rpc_public, port: 18434, label: "RPC proxy (no login)", config: none }
  - env: regtest
    id: bitcoin-cash
    source: { type: github, repo: bitcoin-cash-node/bitcoin-cash-node }
    artifacts:
      - name: "bitcoin-cash-node-x86_64-linux-gnu.tar.gz"
        nameAarch64: "bitcoin-cash-node-aarch64-linux-gnu.tar.gz"
        urlTemplate: "https://github.com/bitcoin-cash-node/bitcoin-cash-node/releases/download/{tag}/bitcoin-cash-node-{version}-x86_64-linux-gnu.tar.gz"
        urlTemplateAarch64: "https://github.com/bitcoin-cash-node/bitcoin-cash-node/releases/download/{tag}/bitcoin-cash-node-{version}-aarch64-linux-gnu.tar.gz"
    configs:
      - name: bitcoin.conf
        urlTemplate: "https://raw.githubusercontent.com/bitcoin-cash-node/bitcoin-cash-node/{tag}/share/examples/bitcoin.conf"
    ports:
      - { role: p2p, port: 18454, label: "P2P", config: required }
      - { role: rpc, port: 18453, label: "RPC", config: required }
      - { role: rpc_public, port: 18544, label: "RPC proxy (no login)", config: none }
