# Vana L1: execution = geth, consensus = Prysm fork. VERIFIED 2026-10-14 against vana-com/vana v2.4.0 (docker-compose.yml, .env.*.example, networks/<env>/).
#  mainnet  geth  : PATCHED v1.16.8 (canonical-state override @ block 9228152, per the release note) = release `geth-v1.16.8-vana9228152` of vana-com/vana; the asset is a raw
#                   static linux/amd64 ELF named exactly like the tag. No arm64 build (aarch64 is unsupported on mainnet). The official compose itself still pins stock v1.16.8.
#  moksha   geth  : stock go-ethereum v1.16.8 (the `gethstore` URL rule of chains/ethereum, pinned: the testnet must not jump to a newer geth)
#  both     prysm : vana-com/prysm (compose default BEACON_IMAGE v7.1.8-vega.1) - `--clear-deposit-contract` exists only in this build; upstream Prysm v5.1.0 does not have it.
# Chain files (genesis.json, genesis.ssz, config.yml) come from raw.githubusercontent.com/vana-com/vana/v2.4.0/networks/<env>/ (pinned to the release tag; `main` moves).
# Ports come from PORTS.md (vana base 42650): mainnet 42650-42659, moksha 42660-42669.
programs:
  - env: mainnet
    id: geth
    source: { type: github, repo: vana-com/vana, tagPrefix: "geth-v" }
    artifacts:
      - name: "geth-linux-amd64"
        urlTemplate: "https://github.com/vana-com/vana/releases/download/{tag}/{tag}"
    configs:
      - name: "genesis.json"
        urlTemplate: "https://raw.githubusercontent.com/vana-com/vana/v2.4.0/networks/mainnet/genesis.json"
      - name: "genesis.ssz"
        urlTemplate: "https://raw.githubusercontent.com/vana-com/vana/v2.4.0/networks/mainnet/genesis.ssz"
      - name: "config.yml"
        urlTemplate: "https://raw.githubusercontent.com/vana-com/vana/v2.4.0/networks/mainnet/config.yml"
    requirements: { logFile: logs/vana.log }
    ports:
      - { role: http, port: 42650, label: "HTTP RPC", config: required }
      - { role: ws, port: 42651, label: "WebSocket RPC", config: required }
      - { role: p2p, port: 42652, label: "P2P", config: required, protocol: both }
      - { role: engine, port: 42653, label: "Engine API (127.0.0.1)", config: required }
      - { role: metrics, port: 42654, label: "Metrics (127.0.0.1)", config: required }
      - { role: beacon, port: 42655, label: "Prysm beacon REST (127.0.0.1)", config: required }
      - { role: consensus_p2p, port: 42656, label: "Prysm P2P (tcp)", config: required }
      - { role: consensus_udp, port: 42657, label: "Prysm P2P (udp)", config: required, protocol: udp }
      - { role: consensus_rpc, port: 42658, label: "Prysm gRPC (127.0.0.1)", config: required }
      - { role: consensus_metrics, port: 42659, label: "Prysm monitoring (127.0.0.1)", config: required }
  - env: mainnet
    id: prysm-beacon
    source: { type: github, repo: vana-com/prysm }
    artifacts:
      - name: "beacon-chain"
        nameAarch64: "beacon-chain"
        urlTemplate: "https://github.com/vana-com/prysm/releases/download/{tag}/beacon-chain-{tag}-linux-amd64"
        urlTemplateAarch64: "https://github.com/vana-com/prysm/releases/download/{tag}/beacon-chain-{tag}-linux-arm64"
  - env: moksha
    id: geth
    source: { type: pinned, version: "1.16.8", tag: "v1.16.8", label: "ethereum/go-ethereum (Vana Moksha pin)" }
    artifacts:
      - name: "geth-linux-amd64.tar.gz"
        nameAarch64: "geth-linux-arm64.tar.gz"
        urlTemplate: "gethstore"
        urlTemplateAarch64: "gethstore"
    configs:
      - name: "genesis.json"
        urlTemplate: "https://raw.githubusercontent.com/vana-com/vana/v2.4.0/networks/moksha/genesis.json"
      - name: "genesis.ssz"
        urlTemplate: "https://raw.githubusercontent.com/vana-com/vana/v2.4.0/networks/moksha/genesis.ssz"
      - name: "config.yml"
        urlTemplate: "https://raw.githubusercontent.com/vana-com/vana/v2.4.0/networks/moksha/config.yml"
    requirements: { logFile: logs/vana.log }
    ports:
      - { role: http, port: 42660, label: "HTTP RPC", config: required }
      - { role: ws, port: 42661, label: "WebSocket RPC", config: required }
      - { role: p2p, port: 42662, label: "P2P", config: required, protocol: both }
      - { role: engine, port: 42663, label: "Engine API (127.0.0.1)", config: required }
      - { role: metrics, port: 42664, label: "Metrics (127.0.0.1)", config: required }
      - { role: beacon, port: 42665, label: "Prysm beacon REST (127.0.0.1)", config: required }
      - { role: consensus_p2p, port: 42666, label: "Prysm P2P (tcp)", config: required }
      - { role: consensus_udp, port: 42667, label: "Prysm P2P (udp)", config: required, protocol: udp }
      - { role: consensus_rpc, port: 42668, label: "Prysm gRPC (127.0.0.1)", config: required }
      - { role: consensus_metrics, port: 42669, label: "Prysm monitoring (127.0.0.1)", config: required }
  - env: moksha
    id: prysm-beacon
    source: { type: github, repo: vana-com/prysm }
    artifacts:
      - name: "beacon-chain"
        nameAarch64: "beacon-chain"
        urlTemplate: "https://github.com/vana-com/prysm/releases/download/{tag}/beacon-chain-{tag}-linux-amd64"
        urlTemplateAarch64: "https://github.com/vana-com/prysm/releases/download/{tag}/beacon-chain-{tag}-linux-arm64"
