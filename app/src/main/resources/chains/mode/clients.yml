# Mode: Mode (Conduit-hosted OP Stack, Superchain Registry `mode`): op-reth + op-node. NO public snapshot (Conduit's bucket is requester-pays): without a snapshot_url the node derives the chain from L1, which takes WEEKS.
# op-reth + op-node: pinned tags of ethereum-optimism/optimism, compiled by the panel build hosts (`build:`, Dockerfiles beside this file) and
# synced as `<name>-<arch>`; a host without the prebuilt binary compiles them itself (chains/opstack/run.sh.tmpl).
# The pins MUST equal OpstackToolchain.RETH_TAG / NODE_TAG (a test keeps them equal).
programs:
  - env: mainnet
    id: op-reth
    source: { type: pinned, version: "2.6.0", tag: "op-reth/v2.6.0", label: "ethereum-optimism/optimism" }
    build: { dockerfile: op-reth.Dockerfile, outputs: [op-reth], platforms: [linux/amd64, linux/arm64] }
    requirements: { logFile: logs/mode.log }
    artifacts: []
    ports:
      - { role: http, port: 41990, label: "EL JSON-RPC", config: required }
      - { role: ws, port: 41991, label: "EL WebSocket", config: required }
      - { role: engine, port: 41993, label: "EL Engine API (127.0.0.1)", config: required }
      - { role: metrics, port: 41994, label: "EL metrics (127.0.0.1)", config: required }
      - { role: p2p, port: 41992, label: "EL P2P", config: required, protocol: both }
      - { role: discv5, port: 41998, label: "EL discv5 (UDP)", config: required, protocol: udp }
  - env: mainnet
    id: op-node
    source: { type: pinned, version: "1.19.9", tag: "op-node/v1.19.9", label: "ethereum-optimism/optimism" }
    build: { dockerfile: op-node.Dockerfile, outputs: [op-node], platforms: [linux/amd64, linux/arm64] }
    requirements: { logFile: logs/mode.log }
    artifacts: []
    ports:
      - { role: cl_rpc, port: 41995, label: "op-node RPC (127.0.0.1)", config: required }
      - { role: cl_metrics, port: 41997, label: "op-node metrics (127.0.0.1)", config: required }
      - { role: cl_p2p, port: 41996, label: "op-node P2P", config: required, protocol: both }
  - env: sepolia
    id: op-reth
    source: { type: pinned, version: "2.6.0", tag: "op-reth/v2.6.0", label: "ethereum-optimism/optimism" }
    build: { dockerfile: op-reth.Dockerfile, outputs: [op-reth], platforms: [linux/amd64, linux/arm64] }
    requirements: { logFile: logs/mode.log }
    artifacts: []
    ports:
      - { role: http, port: 42000, label: "EL JSON-RPC", config: required }
      - { role: ws, port: 42001, label: "EL WebSocket", config: required }
      - { role: engine, port: 42003, label: "EL Engine API (127.0.0.1)", config: required }
      - { role: metrics, port: 42004, label: "EL metrics (127.0.0.1)", config: required }
      - { role: p2p, port: 42002, label: "EL P2P", config: required, protocol: both }
      - { role: discv5, port: 42008, label: "EL discv5 (UDP)", config: required, protocol: udp }
  - env: sepolia
    id: op-node
    source: { type: pinned, version: "1.19.9", tag: "op-node/v1.19.9", label: "ethereum-optimism/optimism" }
    build: { dockerfile: op-node.Dockerfile, outputs: [op-node], platforms: [linux/amd64, linux/arm64] }
    requirements: { logFile: logs/mode.log }
    artifacts: []
    ports:
      - { role: cl_rpc, port: 42005, label: "op-node RPC (127.0.0.1)", config: required }
      - { role: cl_metrics, port: 42007, label: "op-node metrics (127.0.0.1)", config: required }
      - { role: cl_p2p, port: 42006, label: "op-node P2P", config: required, protocol: both }
