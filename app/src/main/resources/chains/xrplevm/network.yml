# XRPL EVM Sidechain — CometBFT / Cosmos SDK family recipe (chains/cometbft shared code, chains/xrplevm thin classes).
# Snapshot: see snapshotTypes per env. Ports live in clients.yml beside this file. Draft — see specs/cosmos/FAMILY.md.
label: XRPL EVM Sidechain
hostPackages:
  - lz4
diskRoles:
  - id: home
    label: Node home (config + data)
    media: nvme
diskNotes:
  - "--home is the home role leaf: config/ (config.toml, app.toml, genesis.json, node_key.json) and data/ live there; snapshots extract into it."
  - "Pruned RPC node by default (pruning=default, min-retain-blocks=0). Archive history is not offered."
  - "The binary, logs and .toolkit state live under the node_dir."
  - "Docs list v10.1.0 as 'current' but mainnet RPC reports 11.2.0 and testnet follows — install the latest stable (highest semver)."
  - "evm-chain-id under [evm] in app.toml is mandatory for v10+ (mainnet 1440000, testnet 1449000)."
oneEnvPerHost: false
envs:
  - id: mainnet
    label: XRPL EVM Mainnet (xrplevm_1440000-1)
    diskHintGiB: 256
    fullNodeGiB: 128
    cpuCores: 4
    memoryGiB: 16
    snapshot: required
    publicTip:
      urls:
        - https://cosmos-rpc.xrplevm.org
        - https://xrp-rpc.polkachu.com
        - https://rpc.xrpl.cumulo.org.es
    snapshotTypes:
      - id: pruned
        kind: full
        label: "Pruned · Peersyst official (lz4, daily)"
        hint: "Official XRPL EVM snapshot (Peersyst S3; ~0.1 GB lz4, state-sync derived). Default."
        diskGiB: 20
        default: true
  - id: testnet
    label: XRPL EVM Testnet (xrplevm_1449000-1)
    diskHintGiB: 128
    fullNodeGiB: 64
    cpuCores: 4
    memoryGiB: 16
    snapshot: required
    publicTip:
      urls:
        - https://cosmos-rpc.testnet.xrplevm.org
        - https://xrp-testnet-rpc.polkachu.com
    snapshotTypes:
      - id: pruned
        kind: full
        label: "Pruned · Peersyst official (lz4, daily)"
        hint: "Official testnet snapshot (Peersyst S3, ~10 GB lz4). Default."
        diskGiB: 60
        default: true
# config.toml / app.toml are patched on every Start (chains/cometbft CometbftTomlPatch); literals below equal CometbftConfigDefaults + the unit.
clientConfig:
  program: exrpd
  format: flags
  bindings:
    - key: home
      source: disk_role_dir
      role: home
      description: "exrpd --home (Disks home role)"
    - key: rpc.laddr
      source: catalog_port
      role: cl_rpc
      description: CometBFT RPC port (0.0.0.0)
    - key: p2p.laddr
      source: catalog_port
      role: p2p
      description: CometBFT P2P port (0.0.0.0, TCP)
    - key: instrumentation.prometheus_listen_addr
      source: catalog_port
      role: metrics
      description: Prometheus port (bound to 127.0.0.1)
    - key: api.address
      source: catalog_port
      role: api
      description: Cosmos REST (LCD) port (0.0.0.0)
    - key: grpc.address
      source: catalog_port
      role: grpc
      description: Cosmos gRPC port (0.0.0.0)
    - key: json-rpc.address
      source: catalog_port
      role: http
      description: EVM JSON-RPC HTTP port (0.0.0.0)
    - key: json-rpc.ws-address
      source: catalog_port
      role: ws
      description: EVM JSON-RPC WebSocket port (0.0.0.0)
    - key: json-rpc.metrics-address
      source: catalog_port
      role: json_rpc_metrics
      description: EVM JSON-RPC metrics port (127.0.0.1)
    - key: rpc.unsafe
      source: literal
      value: "false"
      description: CometBFT unsafe RPC routes stay off
    - key: rpc.pprof_laddr
      source: literal
      value: ""
      description: pprof disabled (default localhost:6060 collides between nodes)
    - key: rpc.max_open_connections
      source: literal
      value: "2000"
      description: RPC + WebSocket connection cap (CometBFT default 900)
    - key: rpc.max_subscription_clients
      source: literal
      value: "100"
      description: Max /subscribe clients
    - key: rpc.max_subscriptions_per_client
      source: literal
      value: "5"
      description: Max subscriptions per client
    - key: rpc.timeout_broadcast_tx_commit
      source: literal
      value: "10s"
      description: broadcast_tx_commit timeout
    - key: rpc.max_body_bytes
      source: literal
      value: "1000000"
      description: Max RPC request body
    - key: p2p.max_num_inbound_peers
      source: literal
      value: "40"
      description: Inbound peer slots
    - key: p2p.max_num_outbound_peers
      source: literal
      value: "10"
      description: Outbound peer slots
    - key: mempool.size
      source: literal
      value: "5000"
      description: Mempool tx count
    - key: mempool.max_txs_bytes
      source: literal
      value: "1073741824"
      description: Mempool bytes (1 GiB)
    - key: tx_index.indexer
      source: literal
      value: "kv"
      description: Tx indexer (tx-by-hash and /tx_search)
    - key: instrumentation.prometheus
      source: literal
      value: "true"
      description: Prometheus on (loopback only)
    - key: minimum-gas-prices
      source: literal
      value: "0axrp"
      description: app.toml minimum-gas-prices (Polkachu / chain minimum)
    - key: pruning
      source: literal
      value: "default"
      description: app.toml state pruning (default = last 362880 states)
    - key: min-retain-blocks
      source: literal
      value: "0"
      description: app.toml CometBFT block retention (0 = keep all)
    - key: api.enable
      source: literal
      value: "true"
      description: REST API on
    - key: api.swagger
      source: literal
      value: "false"
      description: Swagger UI off
    - key: api.max-open-connections
      source: literal
      value: "1000"
      description: REST connection cap
    - key: api.rpc-max-body-bytes
      source: literal
      value: "1000000"
      description: REST max body
    - key: api.enabled-unsafe-cors
      source: literal
      value: "false"
      description: No wildcard CORS on REST
    - key: grpc.enable
      source: literal
      value: "true"
      description: gRPC on
    - key: grpc.max-recv-msg-size
      source: literal
      value: "10485760"
      description: gRPC max receive message
    - key: grpc-web.enable
      source: literal
      value: "false"
      description: grpc-web off
    - key: state-sync.snapshot-interval
      source: literal
      value: "0"
      description: Do not serve state-sync snapshots
    - key: json-rpc.enable
      source: literal
      value: "true"
      description: EVM JSON-RPC on
    - key: json-rpc.api
      source: literal
      value: "eth,net,web3"
      description: Public EVM namespaces (no debug/txpool/personal/admin)
    - key: json-rpc.gas-cap
      source: literal
      value: "25000000"
      description: eth_call/estimateGas gas cap
    - key: json-rpc.evm-timeout
      source: literal
      value: "5s"
      description: eth_call timeout
    - key: json-rpc.logs-cap
      source: literal
      value: "10000"
      description: eth_getLogs result cap
    - key: json-rpc.block-range-cap
      source: literal
      value: "10000"
      description: eth_getLogs block range cap
    - key: json-rpc.filter-cap
      source: literal
      value: "200"
      description: Max open filters
    - key: json-rpc.batch-request-limit
      source: literal
      value: "1000"
      description: JSON-RPC batch size
    - key: json-rpc.allow-unprotected-txs
      source: literal
      value: "false"
      description: Reject non-EIP-155 txs
    - key: json-rpc.enable-profiling
      source: literal
      value: "false"
      description: No debug profiling
    # evm-chain-id differs per env (mainnet 1440000, testnet 1449000) but bindings are network-wide and env_fact == literal today.
    # PROPOSED: per-env binding values. Until then the Start config preview shows the mainnet default and XrplevmProfile.evmChainId(env) is authoritative.
    - key: evm.evm-chain-id
      source: env_fact
      default: "1440000"
      description: app.toml [evm] evm-chain-id (mandatory for exrpd v10+; testnet = 1449000)
    - key: LimitNOFILE
      source: literal
      value: "1048576"
      description: systemd LimitNOFILE for exrpd

# Node page checks (host agent). path_mtu: PMTU black hole (path < interface MTU) makes peers time out.
diagnostics:
  - id: path_mtu
