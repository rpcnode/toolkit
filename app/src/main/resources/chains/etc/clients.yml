# Core-Geth (Ethereum Classic execution client) from the ethereumclassic/core-geth GitHub releases (no Docker).
# VERIFIED 2026-10-13: v1.13.0 (2026-09-14) is the latest stable release and the project's "recommended client";
# linux x86_64 / arm64 zips exist (HTTP 200). The old repo etclabscore/core-geth stops at v1.12.23 (known CVEs, Go 1.21) — do not use it.
# Proof of work: no consensus client, no Engine API port (v1.13 does not open 8551 on ETC / Mordor).
# Each zip holds `geth` (ELF, mode 0755) + COPYING at its root — EtcHostBinaries extracts it to <node_dir>/bin/geth.
# Ports come from the central plan (specs/PORTS.md): etc base 41390; env0 mainnet 41390-41399, env1 mordor 41400-41409.
#   +0 http (JSON-RPC)   +2 p2p (TCP + UDP discovery, the same number)   +1 ws / +4 metrics reserved, not started.
programs:
  - env: mainnet
    id: core-geth
    source: { type: github, repo: ethereumclassic/core-geth }
    artifacts:
      - name: "core-geth-linux.zip"
        nameAarch64: "core-geth-arm64.zip"
        urlTemplate: "https://github.com/ethereumclassic/core-geth/releases/download/{tag}/core-geth-linux-{tag}.zip"
        urlTemplateAarch64: "https://github.com/ethereumclassic/core-geth/releases/download/{tag}/core-geth-arm64-{tag}.zip"
    ports:
      - { role: http, port: 41390, label: "HTTP RPC", config: required }
      - { role: ws, port: 41391, label: "WebSocket RPC", config: required }
      - { role: p2p, port: 41392, label: "P2P", config: required, protocol: both }
  - env: mordor
    id: core-geth
    source: { type: github, repo: ethereumclassic/core-geth }
    artifacts:
      - name: "core-geth-linux.zip"
        nameAarch64: "core-geth-arm64.zip"
        urlTemplate: "https://github.com/ethereumclassic/core-geth/releases/download/{tag}/core-geth-linux-{tag}.zip"
        urlTemplateAarch64: "https://github.com/ethereumclassic/core-geth/releases/download/{tag}/core-geth-arm64-{tag}.zip"
    ports:
      - { role: http, port: 41400, label: "HTTP RPC", config: required }
      - { role: ws, port: 41401, label: "WebSocket RPC", config: required }
      - { role: p2p, port: 41402, label: "P2P", config: required, protocol: both }
