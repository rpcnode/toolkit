# No `snapshots:` block: Mithril snapshots are certified and verified CLIENT-side by mithril-client (the files come from
# Google Cloud Storage per aggregator); a toolkit CDN mirror cannot carry them. See CardanoSnapshotResolver (mithril://{env}).
