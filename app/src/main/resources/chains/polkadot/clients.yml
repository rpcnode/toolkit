# polkadot + prepare/execute workers from paritytech/polkadot-sdk GitHub releases (bare binaries, no archive, no Docker).
# VERIFIED 2026-10-14: polkadot-stable2609 ships `polkadot`, `polkadot-prepare-worker`, `polkadot-execute-worker`. The three MUST be
# the same version and sit in the SAME directory (bin/): the node resolves the workers next to its own executable and refuses to
# start on a version mismatch (polkadot/node/service/src/workers.rs). Parity publishes NO linux-aarch64 binary (only
# aarch64-apple-darwin): an aarch64 host has no install route (no urlTemplateAarch64).
# Tag rule (PolkadotClientReleaseResolver): polkadot-stable<YYMM>[-<n>], not a prerelease, all three assets, highest (YYMM, n) -
# never by date (polkadot-stable2603-7 was published after 2609 and has 2 assets). One binary serves all three envs
# (--chain polkadot|paseo|westend).
# Ports: +0 JSON-RPC (HTTP and WS), +2 p2p, +4 Prometheus (127.0.0.1), +5 the optional REST API (install option indexer=rest-api),
# +6 / +7 the history indexer's GraphQL API and processor Prometheus (install option indexer=history; both loopback-only, the units
# are confined to 127.0.0.1 by systemd - put a reverse proxy on the host in front of +6).
programs:
  - env: mainnet
    id: polkadot
    source: { type: github, repo: paritytech/polkadot-sdk, tagPrefix: "polkadot-stable" }
    artifacts:
      - name: "polkadot"
        urlTemplate: "https://github.com/paritytech/polkadot-sdk/releases/download/{tag}/polkadot"
      - name: "polkadot-prepare-worker"
        urlTemplate: "https://github.com/paritytech/polkadot-sdk/releases/download/{tag}/polkadot-prepare-worker"
      - name: "polkadot-execute-worker"
        urlTemplate: "https://github.com/paritytech/polkadot-sdk/releases/download/{tag}/polkadot-execute-worker"
    requirements: { logFile: logs/polkadot.log }
    ports:
      - { role: http, port: 42200, label: "JSON-RPC (HTTP + WS)", config: required }
      - { role: p2p, port: 42202, label: "P2P (tcp; litep2p also udp/webrtc-direct)", config: required, protocol: both }
      - { role: metrics, port: 42204, label: "Prometheus (127.0.0.1)", config: required }
      - { role: indexer, port: 42205, label: "REST API (optional polkadot-rest-api)", config: required }
      - { role: history_api, port: 42206, label: "History indexer GraphQL API (127.0.0.1, optional)", config: required }
      - { role: history_metrics, port: 42207, label: "History processor Prometheus (127.0.0.1, optional)", config: required }
  - env: paseo
    id: polkadot
    source: { type: github, repo: paritytech/polkadot-sdk, tagPrefix: "polkadot-stable" }
    artifacts:
      - name: "polkadot"
        urlTemplate: "https://github.com/paritytech/polkadot-sdk/releases/download/{tag}/polkadot"
      - name: "polkadot-prepare-worker"
        urlTemplate: "https://github.com/paritytech/polkadot-sdk/releases/download/{tag}/polkadot-prepare-worker"
      - name: "polkadot-execute-worker"
        urlTemplate: "https://github.com/paritytech/polkadot-sdk/releases/download/{tag}/polkadot-execute-worker"
    requirements: { logFile: logs/polkadot.log }
    ports:
      - { role: http, port: 42210, label: "JSON-RPC (HTTP + WS)", config: required }
      - { role: p2p, port: 42212, label: "P2P (tcp; litep2p also udp/webrtc-direct)", config: required, protocol: both }
      - { role: metrics, port: 42214, label: "Prometheus (127.0.0.1)", config: required }
      - { role: indexer, port: 42215, label: "REST API (optional polkadot-rest-api)", config: required }
      - { role: history_api, port: 42216, label: "History indexer GraphQL API (127.0.0.1, optional)", config: required }
      - { role: history_metrics, port: 42217, label: "History processor Prometheus (127.0.0.1, optional)", config: required }
  - env: westend
    id: polkadot
    source: { type: github, repo: paritytech/polkadot-sdk, tagPrefix: "polkadot-stable" }
    artifacts:
      - name: "polkadot"
        urlTemplate: "https://github.com/paritytech/polkadot-sdk/releases/download/{tag}/polkadot"
      - name: "polkadot-prepare-worker"
        urlTemplate: "https://github.com/paritytech/polkadot-sdk/releases/download/{tag}/polkadot-prepare-worker"
      - name: "polkadot-execute-worker"
        urlTemplate: "https://github.com/paritytech/polkadot-sdk/releases/download/{tag}/polkadot-execute-worker"
    requirements: { logFile: logs/polkadot.log }
    ports:
      - { role: http, port: 42220, label: "JSON-RPC (HTTP + WS)", config: required }
      - { role: p2p, port: 42222, label: "P2P (tcp; litep2p also udp/webrtc-direct)", config: required, protocol: both }
      - { role: metrics, port: 42224, label: "Prometheus (127.0.0.1)", config: required }
      - { role: indexer, port: 42225, label: "REST API (optional polkadot-rest-api)", config: required }
      - { role: history_api, port: 42226, label: "History indexer GraphQL API (127.0.0.1, optional)", config: required }
      - { role: history_metrics, port: 42227, label: "History processor Prometheus (127.0.0.1, optional)", config: required }
# No `snapshots:` block: snapshots.polkadot.io is a multi-file store (files.txt manifest), not one archive; discovery +
# download are SubstrateSnapshotResolver (substrate-files://) and the agent runner SubstrateFilesSnapshot, like cardano's mithril://.
