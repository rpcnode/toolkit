# go-flare (Flare / Songbird / Coston2) from flare-foundation/go-flare GitHub releases (no Docker).
# VERIFIED 2026-10-13: v1.14.0 is the latest stable (2026-06-17); v1.14.2-rc.0 is a prerelease (skipped). The ONLY release asset is
# go-flare-<tag>-linux-amd64.zip (+ .sig/.pem/.slsa) containing a single file `avalanchego` (93 MB ELF). There is NO arm64 build: aarch64 hosts must be refused.
# (The repo flare-foundation/flare stops at v0.6.5 in 2024 — wrong repo.)  Network flag values: flare | songbird | costwo.
# Ports come from specs/PORTS.md (flare base 41450): flare 41450-41459, songbird 41460-41469, coston2 41470-41479.
programs:
  - env: flare
    id: go-flare
    source: { type: github, repo: flare-foundation/go-flare }
    artifacts:
      - name: "go-flare-linux-amd64.zip"
        urlTemplate: "https://github.com/flare-foundation/go-flare/releases/download/{tag}/go-flare-{tag}-linux-amd64.zip"
    requirements: { logFile: logs/flare.log }
    ports:
      - { role: http, port: 41450, label: "HTTP API / C-Chain RPC", config: required }
      - { role: p2p, port: 41452, label: "Staking P2P", config: required }
  - env: songbird
    id: go-flare
    source: { type: github, repo: flare-foundation/go-flare }
    artifacts:
      - name: "go-flare-linux-amd64.zip"
        urlTemplate: "https://github.com/flare-foundation/go-flare/releases/download/{tag}/go-flare-{tag}-linux-amd64.zip"
    requirements: { logFile: logs/flare.log }
    ports:
      - { role: http, port: 41460, label: "HTTP API / C-Chain RPC", config: required }
      - { role: p2p, port: 41462, label: "Staking P2P", config: required }
  - env: coston2
    id: go-flare
    source: { type: github, repo: flare-foundation/go-flare }
    artifacts:
      - name: "go-flare-linux-amd64.zip"
        urlTemplate: "https://github.com/flare-foundation/go-flare/releases/download/{tag}/go-flare-{tag}-linux-amd64.zip"
    requirements: { logFile: logs/flare.log }
    ports:
      - { role: http, port: 41470, label: "HTTP API / C-Chain RPC", config: required }
      - { role: p2p, port: 41472, label: "Staking P2P", config: required }
