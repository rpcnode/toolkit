# Pin-only — MyTonCtrl install.sh on the host (no CDN artifacts).
# P2P moved off 3031x (Go sibling facts): 30311 is the BSC mainnet P2P port, both nodes may share a host.
programs:
  - env: mainnet
    id: validator-engine
    source: { type: pinned, version: "2.18.0", tag: "v2.18.0", label: "ton-blockchain/mytonctrl" }
    skipReason: "Host MyTonCtrl install (pin-only)"
    requirements: { logFile: logs/ton.log }
    artifacts: []
    ports:
      - { role: http, port: 8081, label: "TON HTTP API", config: required }
      - { role: p2p, port: 31310, label: "P2P (validator)", config: required, protocol: udp }
      - { role: indexer, port: 8187, label: "Indexer API v3", config: none }
      - { role: indexer_redis, port: 16387, label: "Indexer Redis (local)", config: none }
      - { role: rpc_public, port: 8087, label: "Public API (v2 + v3)", config: none }
  - env: testnet
    id: validator-engine
    source: { type: pinned, version: "2.18.0", tag: "v2.18.0", label: "ton-blockchain/mytonctrl" }
    skipReason: "Host MyTonCtrl install (pin-only)"
    requirements: { logFile: logs/ton.log }
    artifacts: []
    ports:
      - { role: http, port: 8082, label: "TON HTTP API", config: required }
      - { role: p2p, port: 31311, label: "P2P (validator)", config: required, protocol: udp }
      - { role: indexer, port: 8188, label: "Indexer API v3", config: none }
      - { role: indexer_redis, port: 16388, label: "Indexer Redis (local)", config: none }
      - { role: rpc_public, port: 8088, label: "Public API (v2 + v3)", config: none }
