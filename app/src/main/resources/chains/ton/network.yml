# Toncoin liteserver (MyTonCtrl). Pin-only — no CDN tarball.
# Directory name is the network id. Ports live in clients.yml beside this file.
label: Toncoin
hostPackages:
  - git
  - python3-pip
  # MyTonCtrl compiles the TON node with clang 21 (not a plain distro package: LLVM repo of the base Ubuntu/Debian)
  - clang-21
diskRoles:
  - id: blockchain
    label: Blockchain DB
    media: nvme
  - id: archive
    label: Archive / additional
    media: ssd
  - id: indexer
    label: Indexer (PostgreSQL, v3 API)
    media: nvme
diskNotes:
  - "MyTonCtrl uses host-global /var/ton-work — RpcNode symlinks it to the blockchain disk role."
  - "Only one TON env per host (validator/mytoncore units are shared)."
  - "Dump (~30d) is the product default; archive needs ≥12 TiB NVMe."
  - "The v3 indexer is installed with the node (no Docker, after the node install): toncenter worker/classifier/API are built from source; the database is a PostgreSQL cluster of its own for this node (data AND WAL on the indexer disk, loopback-only catalog port, tuned for the load) — the host's other PostgreSQL servers are never touched and the system disk takes no WAL traffic. A node installed before dedicated clusters keeps its role/database/tablespace in the shared server as it was. Removing the node drops the cluster again. It indexes forward from the moment the node is synced and grows with the chain. The first build takes a long time (like the node's). Put the indexer role on its own NVMe."
  - "One public URL: agent port rpc_public serves /api/v2/* (ton-http-api) and /api/v3/* (indexer)."
oneEnvPerHost: true
# Node page warnings, run by the host agent (GET /api/nodes/{id}/diagnostics). port = role from clients.yml.
diagnostics:
  # PMTU black hole (path smaller than interface MTU): full-size packets to peers are dropped.
  - id: path_mtu
  # Behind NAT the validator gets inbound peers only through a router forward of its UDP port.
  - id: nat
    port: p2p
    protocol: udp
  # addrs[] in /var/ton-work/db/config.json must be the public IP and the P2P port, or peers cannot connect back.
  - id: ton_advertised_ip
    port: p2p
  # The host's validator must follow this env (an old install keeps another network's global config).
  - id: ton_network
  # The panel reads the height from the TON HTTP API on the catalog http port; an old unit may keep another --port.
  - id: ton_http_api
    port: http
  # Catch-up after the dump (lag from validator STATUS lines); warn when it would take longer than warnHours.
  - id: ton_catchup
    warnHours: 12
envs:
  - id: mainnet
    label: Toncoin Mainnet
    diskHintGiB: 1024
    fullNodeGiB: 1024
    archiveGiB: 12288
    cpuCores: 8
    memoryGiB: 32
    snapshot: never
    publicTip:
      urls:
        - https://toncenter.com/api/v2/getMasterchainInfo
  - id: testnet
    label: Toncoin Testnet
    diskHintGiB: 256
    fullNodeGiB: 256
    archiveGiB: 4096
    cpuCores: 4
    memoryGiB: 16
    snapshot: never
    publicTip:
      urls:
        - https://testnet.toncenter.com/api/v2/getMasterchainInfo

# Host install via MyTonCtrl — format: flags for Start Config preview.
# Capacity literals must match TonUnitBodies / bootstrap drop-ins.
clientConfig:
  program: validator-engine
  format: flags
  bindings:
    - key: blockchain
      source: disk_role_dir
      role: blockchain
      description: Blockchain DB (NVMe) — /var/ton-work target
    - key: archive
      source: disk_role_dir
      role: archive
      description: Archive / aux path (SSD)
    - key: http
      source: catalog_port
      role: http
      description: TON HTTP API listen port
    - key: p2p
      source: catalog_port
      role: p2p
      description: validator-engine P2P listen port
    - key: history
      source: install_option
      option: history
      default: dump
      description: MyTonCtrl history — dump (~30d) or archive
    - key: LimitNOFILE
      source: literal
      value: "4194304"
      description: systemd LimitNOFILE for validator-engine
    - key: archive_ttl
      source: literal
      value: "2592000"
      description: Archive TTL seconds (~30d) for dump mode
    - key: state_ttl
      source: literal
      value: "86400"
      description: State cache GC TTL seconds (~1d)
    - key: fs.nr_open
      source: literal
      value: "8388608"
      description: sysctl fs.nr_open so the engine can raise RLIMIT_NOFILE
