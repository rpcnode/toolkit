[versions]
kotlin = "2.3.21"
ktor = "3.5.2"
logback = "1.5.38"
coroutines = "1.11.0"
exposed = "0.61.0"
flyway = "10.22.0"
snakeyaml = "2.3"
directories = "26"
appdirs = "1.5.0"
mordant = "3.1.0"

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }

[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty-jvm" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging-jvm" }
ktor-server-double-receive = { module = "io.ktor:ktor-server-double-receive-jvm" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host-jvm" }
ktor-client-core = { module = "io.ktor:ktor-client-core-jvm" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio-jvm" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation-jvm" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock-jvm" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.9.0" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version = "5.14.4" }
jbcrypt = { module = "org.mindrot:jbcrypt", version = "0.4" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version = "3.50.3.0" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
directories = { module = "dev.dirs:directories", version.ref = "directories" }
appdirs = { module = "net.harawata:appdirs", version.ref = "appdirs" }
mordant = { module = "com.github.ajalt.mordant:mordant", version.ref = "mordant" }
