# RpcNode Snapshot CDN — host nginx (no Docker).
#
# Listen 8095. HTML SSR via Next.js on 7090; archives under /snapshots/ (Range + sendfile).
#
# Enable:
#   Point alias at $SNAPSHOT_CDN_DIR/snapshots/ (same root as rpcnode-cdn.jar).
#   Run cdn-site (npm start) on 127.0.0.1:7090 — see deploy/nginx-cdn/README.md
#   sudo cp deploy/nginx-cdn/snapshots.conf /etc/nginx/sites-available/rpcnode-cdn
#   sudo ln -sf /etc/nginx/sites-available/rpcnode-cdn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo nginx -s reload
#   java -jar rpcnode-cdn.jar
#
# Settings → Snapshot CDN origin: http://<host>:8095

server {
    listen 8095;
    listen [::]:8095;
    server_name _;

    # Long downloads / streaming tar unpack (TRON-style Range → pipe).
    sendfile on;
    tcp_nopush on;
    client_max_body_size 0;
    proxy_request_buffering off;

    location /snapshots/ {
        # Operator: set to $SNAPSHOT_CDN_DIR/snapshots/
        alias /opt/rpcnode/lib/snapshots/;
        autoindex off;
        gzip off;
        add_header Accept-Ranges bytes;
        send_timeout 3600s;
        types {
            application/gzip tgz gz;
            application/json json;
            text/plain VERSION;
        }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://127.0.0.1:7090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
