# Optional edge nginx (compose profile "edge"). Default stack is Go-only.
# Tuned for high concurrent RPC when used as TLS / rate-limit front.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
worker_rlimit_nofile 1048576;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    server_tokens off;

    # Buffer access log under load (or set access_log off in high-RPS edge).
    access_log /var/log/nginx/access.log combined buffer=64k flush=5s;

    client_max_body_size 64m;
    client_body_timeout 60s;
    client_header_timeout 30s;

    gzip on;
    gzip_types application/json text/plain application/javascript;
    gzip_min_length 256;
    gzip_proxied any;

    # Generous defaults — tighten via maps in conf.d if needed:
    #   limit_req_zone $binary_remote_addr zone=rpc:32m rate=2000r/s;
    #   limit_conn_zone $binary_remote_addr zone=addr:16m;
    map $request_uri $rpc_limit_key {
        default "";
    }

    include /etc/nginx/conf.d/*.conf;
}
