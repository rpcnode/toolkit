# Optional edge — profile "edge". Proxies to Go api-agent (RPC + panel).
# Prefer Go-only dual ports in production unless you need TLS termination here.

upstream api_rpc {
    server api-agent:8090;
    keepalive 256;
}

upstream api_panel {
    server api-agent:8093;
    keepalive 64;
}

server {
    listen 8090;
    server_name _;

    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 5s;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;

    # Health → RPC agent
    location = /healthz {
        proxy_pass http://api_rpc;
    }

    # Panel paths → panel listen (auth enforced inside api-agent)
    location ^~ /status {
        proxy_pass http://api_panel;
    }
    location ^~ /api/ {
        proxy_pass http://api_panel;
    }
    location = /status.json {
        proxy_pass http://api_panel;
    }
    location = /instance.json {
        proxy_pass http://api_panel;
    }
    location = /instances.json {
        proxy_pass http://api_panel;
    }

    # Everything else → RPC catch-all (FullNode HTTP)
    location / {
        proxy_pass http://api_rpc;
    }
}
